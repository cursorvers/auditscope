name: Daily Medical Paper Digest

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = JST 07:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run digest generation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python src/main.py
    
    - name: Commit audit logs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add logs/audit/
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "audit: $(date -I)"
          git push
        fi
    
    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Daily Digest Failed - ' + new Date().toISOString().split('T')[0],
            body: 'The daily medical paper digest workflow failed. Please check the workflow logs for details.\n\nWorkflow run: ' + context.payload.repository.html_url + '/actions/runs/' + context.runId
          })